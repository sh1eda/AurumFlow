[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurumflow"
version = "0.1.0"
description = "Explainable XAUUSD signal research toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AurumFlow contributors" }]
keywords = [
    "xauusd",
    "trading-research",
    "backtesting",
    "market-structure",
    "smc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aurumflow = "xauusd_signal.cli:main"
xauusd-signal = "xauusd_signal.cli:main"

[tool.setuptools.packages.find]
include = ["xauusd_signal*"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/event_study_0830_0930/tests"]
pythonpath = ["."]
